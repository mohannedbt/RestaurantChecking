<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion Étudiant</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

<div class="card p-4 shadow" style="width:350px;">
  <h4 class="text-center mb-3">Connexion</h4>
  <label class="form-label">Numéro Carte Étudiant</label>
  <input type="text" id="carte" class="form-control" required>
  <button class="btn btn-success w-100 mt-3" onclick="login()">Se connecter</button>
</div>

<script>
function login() {
    const carte = document.getElementById('carte').value.trim();
    if (!carte) { alert("Saisir le numéro de carte"); return; }

    const etudiant = { carte, dateLogin: new Date().toISOString() };
    localStorage.setItem('etudiant', JSON.stringify(etudiant));
    window.location.href = "index.html";
}
</script>
</body>
</html>
