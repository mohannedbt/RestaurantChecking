<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recyclage - Association - Restaurant2025</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family: 'Helvetica', sans-serif; background: linear-gradient(135deg, #a8e6cf, #dcedc1); color: #fff; }
.overlay { background: rgba(0,0,0,0.3); min-height: 100vh; padding: 2rem; }
</style>
</head>
<body>
<div class="overlay">
<header class="mb-8 flex justify-between items-center">
  <h1 class="text-3xl font-bold">Recyclage et Sensibilisation Écologique</h1>
  <a href="/associations" class="bg-white text-green-700 px-3 py-1 rounded hover:bg-gray-200">Retour</a>
</header>

<section class="mt-6">
  <h2 class="text-2xl font-bold mb-4">Actions existantes</h2>
  <div id="recyclage-container" class="space-y-4">
    <!-- Les actions seront chargées ici -->
  </div>

  <h2 class="text-2xl font-bold mt-6 mb-2">Ajouter une nouvelle action</h2>
  <form id="add-action-form" class="flex gap-2 flex-col md:flex-row">
    <input type="text" id="titre-action" placeholder="Titre de l'action" class="p-2 rounded text-black flex-1" required>
    <input type="text" id="desc-action" placeholder="Description" class="p-2 rounded text-black flex-1" required>
    <button type="submit" class="bg-white text-green-700 px-3 py-1 rounded hover:bg-gray-200">Ajouter</button>
  </form>
</section>

<script>
async function loadRecyclage() {
  const container = document.getElementById("recyclage-container");
  container.innerHTML = "Chargement...";

  try {
    const res = await fetch("/association/recyclage");
    const actions = await res.json();
    container.innerHTML = "";

    if (!actions.length) {
      container.innerHTML = "<p>Aucune action enregistrée pour le moment.</p>";
      return;
    }

    actions.forEach(action => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `<h3 class="text-xl font-semibold">${action.titre}</h3><p>${action.description}</p>`;
      container.appendChild(div);
    });
  } catch(err) {
    console.error(err);
    container.innerHTML = "<p>Erreur lors du chargement des actions.</p>";
  }
}

document.getElementById("add-action-form").addEventListener("submit", async e => {
  e.preventDefault();
  const titre = document.getElementById("titre-action").value.trim();
  const description = document.getElementById("desc-action").value.trim();
  if (!titre || !description) return;

  try {
    await fetch("/association/recyclage", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ titre, description })
    });

    document.getElementById("titre-action").value = "";
    document.getElementById("desc-action").value = "";
    loadRecyclage();
  } catch(err) {
    console.error(err);
    alert("Erreur lors de l'ajout de l'action.");
  }
});

loadRecyclage();
</script>

</div>
</body>
</html>
