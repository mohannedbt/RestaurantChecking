<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ateliers Écologiques - Association - Restaurant2025</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {
  font-family: 'Helvetica', sans-serif;
  background: linear-gradient(135deg, #a8e6cf, #dcedc1);
  color: #fff;
}
.overlay {
  background: rgba(0,0,0,0.3);
  min-height: 100vh;
  padding: 2rem;
}
.container {
  max-width: 900px;
  margin: auto;
}
.card {
  background: rgba(0,0,0,0.3);
  padding: 1.5rem;
  border-radius: 1rem;
  margin-bottom: 1.5rem;
  backdrop-filter: blur(5px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
input, textarea, button {
  font-size: 1rem;
}
</style>
</head>
<body>
<div class="overlay">
  <div class="container">
    <header class="mb-8 flex justify-between items-center">
      <h1 class="text-3xl font-bold">Ateliers Écologiques</h1>
      <a href="/associations" class="bg-white text-green-700 px-3 py-1 rounded hover:bg-gray-200">Retour</a>
    </header>

    <div class="card">
      <h2 class="text-2xl font-bold mb-3">Créer un nouvel atelier</h2>
      <form id="atelier-form" class="space-y-4">
        <input type="text" id="titre" placeholder="Titre de l'atelier" class="w-full p-2 rounded text-black" required>
        <textarea id="description" placeholder="Description de l'atelier" class="w-full p-2 rounded text-black" required></textarea>
        <input type="date" id="date" class="w-full p-2 rounded text-black" required>
        <button type="submit" class="bg-green-700 px-4 py-2 rounded hover:bg-green-600">Créer Atelier</button>
      </form>
    </div>

    <div id="atelier-list">
      <!-- Les ateliers existants s'afficheront ici -->
    </div>
  </div>
</div>

<script>
// Charger les ateliers
async function loadAteliers() {
  const container = document.getElementById("atelier-list");
  container.innerHTML = "<p>Chargement des ateliers...</p>";

  const res = await fetch("/association/ateliers");
  const data = await res.json();
  container.innerHTML = "";

  if (!data.length) {
    container.innerHTML = "<p>Aucun atelier disponible.</p>";
    return;
  }

  data.forEach(atelier => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <h2 class="text-xl font-bold mb-2">${atelier.titre}</h2>
      <p class="mb-2">${atelier.description}</p>
      <p class="mb-2 font-semibold">Date: ${atelier.date}</p>
      <button class="bg-white text-green-700 px-3 py-1 rounded hover:bg-gray-200" onclick="supprimerAtelier('${atelier.id}')">Supprimer</button>
    `;
    container.appendChild(div);
  });
}

// Ajouter un nouvel atelier
document.getElementById("atelier-form").addEventListener("submit", async e => {
  e.preventDefault();
  const titre = document.getElementById("titre").value.trim();
  const description = document.getElementById("description").value.trim();
  const date = document.getElementById("date").value;

  if (!titre || !description || !date) return;

  const res = await fetch("/association/ateliers", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ titre, description, date })
  });
  const result = await res.json();
  alert(result.message);
  document.getElementById("atelier-form").reset();
  loadAteliers();
});

// Supprimer un atelier
async function supprimerAtelier(id) {
  const res = await fetch(`/association/ateliers/${id}`, { method: "DELETE" });
  const result = await res.json();
  alert(result.message);
  loadAteliers();
}

// Initial load
loadAteliers();
</script>
</body>
</html>
