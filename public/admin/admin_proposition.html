<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Propositions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Header -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Admin Dashboard</a>
      <div class="d-flex">
        <button class="btn btn-outline-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <h2 class="mb-4">Student Propositions</h2>
    <div id="proposals-container" class="row g-3">
      <!-- Proposals will be dynamically loaded here -->
    </div>
  </main>

  <footer class="text-center text-muted mt-5 mb-3">
    &copy; 2025 Restaurant Admin
  </footer>

  <script>
    async function loadProposals() {
      const res = await fetch("/admin/propositions");
      const proposals = await res.json();

      const container = document.getElementById("proposals-container");
      container.innerHTML = "";

      if(proposals.length === 0) {
        container.innerHTML = '<p class="text-muted">No propositions submitted yet.</p>';
        return;
      }

      proposals.forEach(p => {
        const col = document.createElement("div");
        col.className = "col-md-6";

        col.innerHTML = `
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">${p.nom} (${p.carteEtudiant})</h5>
              <p class="card-text">${p.proposition}</p>
              <p class="text-muted"><small>${new Date(p.date).toLocaleString()}</small></p>
              <div class="d-flex gap-2">
                <button class="btn btn-success btn-sm" onclick="approve('${p.id}')">Approve</button>
              </div>
              <p class="mt-2 text-success" id="status-${p.id}"></p>
            </div>
          </div>
        `;

        container.appendChild(col);
      });
    }

    async function approve(id) {
      // For simplicity, we'll just update the card text locally
      document.getElementById(`status-${id}`).textContent = "Approved ✅";

      // Optionally, send a PATCH/POST request to backend to mark as approved
       await fetch(`/admin/propositions/${id}/approve`, { method: 'POST' });
       window.location.reload();
    }

    

    function logout() {
      localStorage.removeItem("isAdmin");
      window.location.href = "/admin";
    }

    loadProposals();
  </script>

</body>
</html>
