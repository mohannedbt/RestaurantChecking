<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="bg-white p-10 rounded-xl shadow-lg w-full max-w-md text-center">
    <h1 class="text-2xl font-bold mb-6">Admin Login</h1>

    <!-- Simple login form -->
    <input type="password" id="adminPassword" placeholder="Enter password" 
      class="w-full px-4 py-2 mb-4 border rounded focus:outline-none focus:ring-2 focus:ring-green-600" />

    <button id="loginBtn" 
      class="bg-green-700 text-white px-6 py-2 rounded hover:bg-green-600 transition">Login</button>

    <!-- Redirecting message -->
    <p id="redirectMsg" class="mt-6 text-gray-600 hidden">Redirecting to dashboard...</p>
  </div>

  <script>
    const loginBtn = document.getElementById("loginBtn");
    const redirectMsg = document.getElementById("redirectMsg");
    const adminPassword = "admin123"; // simple hardcoded password (for demo)

    loginBtn.addEventListener("click", () => {
      const input = document.getElementById("adminPassword").value;

      if(input === adminPassword) {
        // Set localStorage flag
        localStorage.setItem("isAdmin", "true");

        // Show redirect message
        redirectMsg.classList.remove("hidden");

        // Redirect after 2 seconds
        setTimeout(() => {
          window.location.href = "/admin/dashboard"; // replace with your dashboard page
        }, 2000);
      } else {
        alert("Wrong password!");
      }
    });

    // Optional: if already logged in, redirect immediately
    if(localStorage.getItem("isAdmin") === "true") {
      window.location.href = "/admin/dashboard";
    }
  </script>

</body>
</html>
