<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Menu</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    background-image: url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092?auto=format&fit=crop&w=1950&q=80');
    background-size: cover;
    background-position: center;
    min-height: 100vh;
    color: #fff;
    font-family: 'Helvetica', sans-serif;
  }

  .overlay {
    background: rgba(0,0,0,0.5);
    min-height: 100vh;
    padding: 2rem;
  }

  .menu-card {
    background: rgba(255,255,255,0.1);
    border-radius: 1rem;
    padding: 2rem;
    margin-bottom: 1.5rem;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  h1 {
    text-align: center;
    font-size: 2.5rem;
    margin-bottom: 2rem;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
  }

  ul li {
    margin-bottom: 0.5rem;
    font-size: 1.25rem;
    text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div class="overlay">
    <h1>Today's Menu</h1>
    <div id="menu-container">
      <!-- Menu items will be loaded here -->
    </div>
  </div><script>
async function loadMenu() {
  const container = document.getElementById('menu-container');
  container.innerHTML = '<p class="text-center text-lg">Loading menu...</p>';

  try {
    const res = await fetch('/api/menu/today');
    if (!res.ok) throw new Error('Menu not found for today');
    const menuData = await res.json();

    container.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'menu-card';

    const date = new Date(menuData.date).toLocaleDateString();
    card.innerHTML = `<h2 class="text-2xl font-bold mb-4">Menu for ${date}</h2>`;

    if (menuData.menu && menuData.menu.length > 0) {
      const ul = document.createElement('ul');
      const labels = ["Entrée", "Plat", "Dessert"];
      menuData.menu.forEach((item, i) => {
        const li = document.createElement('li');
        li.textContent = `${labels[i] || 'Plat'}: ${item}`;
        ul.appendChild(li);
      });
      card.appendChild(ul);
    } else {
      card.innerHTML += '<p>No menu items available today.</p>';
    }

    container.appendChild(card);
  } catch (err) {
    container.innerHTML = `<p class="text-center text-lg">No menu available for today.</p>`;
    console.error(err);
  }
}


loadMenu();
</script>

</body>
</html>
