<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiement Étudiant</title>
  
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
  
    :root{
      --green-1: #2ecc71;
      --green-2: #27ae60;
      --muted: #6c757d;
      --card-radius: 16px;
    }

    html,body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Helvetica Neue", Arial;
      background: linear-gradient(135deg, rgba(39,174,96,0.95) 0%, rgba(46,204,113,0.95) 100%);
      color: #083019;
    }

    /* Header */
    .site-header {
      backdrop-filter: blur(6px);
      background: rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .brand-logo {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.12);
      border: 1px dashed rgba(255,255,255,0.18);
      color: #fff;
      font-weight: 700;
      font-size: 18px;
    }
    .brand-title { color: #fff; font-weight: 700; margin-left: 12px; }

    .card {
        display: flex;
        flex-direction: column;
        align-items: center;
      background: #fff;
      color: #333;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
    }

    h3 {
      font-weight: 700;
      margin-bottom: 20px;
      color: #16a085;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 15px;
    }

    #qrcode {
      margin-top: 20px;
    
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.5s ease;
    }

    #qrcode.show {
      opacity: 1;
      transform: scale(1);
    }

    button {
      margin-top: 15px;
      font-weight: 600;
      border-radius: 10px;
      padding: 10px 25px;
      transition: all 0.3s ease;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .card_support {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
<!-- Header -->
  <header class="site-header py-3">
    <div class="container d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center">
        <!-- Logo placeholder: replace <div class="brand-logo"> with <img src="logo.png"> when you have a logo -->
        <div class="brand-logo" aria-hidden="true">
          <!-- empty logo placeholder (letters NG = Non Gaspillage) -->
          NG
        </div>
        <div class="brand-title ms-2">
          Le Non-Gaspillage
          <div style="font-size:12px; color: rgba(255,255,255,0.75); font-weight:500;">Quand on va au restaurant</div>
        </div>
      </div>

           <nav class="d-none d-md-flex gap-3 align-items-center">
        <a class="btn btn-sm btn-outline-light" href="/paiment">Je vais au restaurant</a>
        <a class="btn btn-sm btn-outline-light" href="/proposition">Propositions</a>
      </nav>
    </div>
  </header>
  <div class="card_support">
     <div class="card">
    <h3>Paiement Étudiant</h3>
    <p>Date d'aujourd'hui : <span id="today"></span></p>
    <p>Montant : <strong>0.2 DT</strong></p>
    <button id="payBtn" class="btn btn-success btn-lg">OK</button>
    <div id="qrcode"></div>
    <button class="btn btn-secondary btn-sm mt-3" onclick="window.location.href='/'">Retour à l'accueil</button>
  </div>

  </div>
 
  <script>
    // Afficher la date du jour
const todayEl = document.getElementById('today');
todayEl.textContent = new Date().toLocaleDateString('fr-FR', {
  year: 'numeric', month: 'long', day: 'numeric'
});

const etudiant = JSON.parse(localStorage.getItem('etudiant'));
if (!etudiant) {
    window.location.href = "login.html";
}


const payBtn = document.getElementById('payBtn');
const qrDiv = document.getElementById('qrcode');

payBtn.addEventListener('click', async () => {

  qrDiv.innerHTML = ""; // reset

  try {
    // Appel API au serveur pour enregistrer l'opération
    const res = await fetch("http://localhost:3000/generate-qr", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(etudiant)
    });

    const data = await res.json();

    if (!data.operation) {
      alert("Erreur serveur !");
      return;
    }

    const paymentUrl = data.operation.qr; // Lien unique envoyé par le serveur

    // 🔥 Générer le QR Code unique
    new QRCode(qrDiv, {
      text: paymentUrl,
      width: 200,
      height: 200,
      colorDark: "#16a085",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    setTimeout(() => qrDiv.classList.add('show'), 50);

    payBtn.disabled = true;
    payBtn.textContent = "QR Code généré ✓";

  } catch (error) {
    alert("Connexion au serveur impossible !");
    console.log(error);
  }
});

  </script>

</body>
</html>
