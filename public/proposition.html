<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dépôt de Proposition</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, rgba(39,174,96,0.95) 0%, rgba(46,204,113,0.95) 100%);
      font-family: Inter, system-ui, -apple-system, "Helvetica Neue", Arial;
      color: #083019;
    }

    .site-header {
      backdrop-filter: blur(6px);
      background: rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.12);
      border: 1px dashed rgba(255,255,255,0.18);
      color: #fff;
      font-weight: 700;
      font-size: 18px;
    }

    .brand-title {
      color: #fff;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="site-header py-3 mb-5">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <div class="brand-logo">NG</div>
        <div class="brand-title ms-3">
          Le Non-Gaspillage
          <div style="font-size:12px; color: rgba(255,255,255,0.75); font-weight:500;">Quand on va au restaurant</div>
        </div>
      </div>
           <nav class="d-none d-md-flex gap-3 align-items-center">
        <a class="btn btn-sm btn-outline-light" href="/paiment">Je vais au restaurant</a>
        <a class="btn btn-sm btn-outline-light" href="/proposition">Propositions</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="container">
    <div class="card shadow-lg border-start border-4 border-primary mb-5">
      <div class="card-body">
        <h2 class="card-title mb-4">Déposer votre proposition</h2>
        <form id="proposalForm">
          <div class="mb-3">
            <label for="nom" class="form-label">Nom complet:</label>
            <input type="text" id="nom" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="carte" class="form-label">Carte étudiant:</label>
            <input type="text" id="carte" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="proposition" class="form-label">Proposition:</label>
            <textarea id="proposition" class="form-control" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Envoyer</button>
        </form>
        <button class="btn btn-secondary" onclick="window.location.href='/'">Retour</button>

        <p id="msg" class="mt-3 text-success fw-semibold"></p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center text-light small py-3">
    &copy; Restaurant
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const form = document.getElementById("proposalForm");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = {
        nom: document.getElementById("nom").value,
        carteEtudiant: document.getElementById("carte").value,
        proposition: document.getElementById("proposition").value,
        date: new Date().toISOString()
      };

      const res = await fetch("/submit-proposition", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const result = await res.json();
      msg.textContent = result.message;
      form.reset();
    });
  </script>
</body>
</html>
